<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./admin.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="../images/favicon-180.png">
    <title>Create Admin Account | FashionSpeaks</title>
</head>

<body class="auth-page">
    <main class="auth-card">
        <a href="../index.html" class="auth-logo">
            <img src="../images/fs-logo-transparent.png" alt="FashionSpeaks logo">
        </a>

        <h1>Create admin account</h1>
        <p class="auth-sub">Join our team to manage your store.</p>

        <form id="registerForm" class="auth-form">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>

            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="6"
                required>
            <label for="inviteCode">Invite code</label>
            <input type="text" id="inviteCode" name="inviteCode" autocomplete="off" required>

            <p class="form-message" id="formMessage" role="alert"></p>

            <button type="submit" class="auth-btn">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        <a href="../index.html" class="auth-back">Back to store</a>
    </main>

    <script type="module" src="../js/auth.js"></script>
</body>

</html>
